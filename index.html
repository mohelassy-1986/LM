<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Wishes & Greetings</title>
  
  <!-- Google Fonts for Elegant Floral Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --blush-bg: #fdf8f5;
      --card-bg: #ffffff;
      --sage-green: #7d8c73;
      --soft-rose: #d8a7a7;
      --text-dark: #3a3a3a;
      --gold-accent: #c5a059;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--blush-bg);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(216, 167, 167, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(125, 140, 115, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(197, 160, 89, 0.2);
      overflow: hidden;
      margin: 0 auto;
    }

    .header {
      padding: 40px 25px 20px 25px;
      text-align: center;
    }

    .floral-divider {
      font-size: 24px;
      color: var(--gold-accent);
      margin-bottom: 10px;
      letter-spacing: 4px;
    }

    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 600;
      color: var(--sage-green);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .header p {
      font-size: 0.95rem;
      font-weight: 300;
      color: #666;
      max-width: 80%;
      margin: 0 auto;
      line-height: 1.5;
    }

    .form-wrapper {
      padding: 10px 20px 30px 20px;
      width: 100%;
    }

    iframe {
      width: 100%;
      min-height: 700px;
      border: none;
      border-radius: 12px;
    }

    .footer {
      text-align: center;
      padding-bottom: 25px;
      font-size: 0.8rem;
      color: #999;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 2.1rem;
      }
      .header p {
        max-width: 95%;
      }
      .form-wrapper {
        padding: 5px 10px 20px 10px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="floral-divider">❀ ❁ ❀</div>
      <h1>Wedding Wishes</h1>
      <p>Leave your love, photos, videos, or voice messages for the happy couple</p>
    </header>

    <main class="form-wrapper">
      <iframe 
        id="JotFormIFrame-262794424640057"
        title="Wedding Greetings Form"
        onload="window.parent.scrollTo(0,0)"
        allowtransparency="true"
        allow="geolocation; microphone; camera; fullscreen"
        src="https://form.jotform.com/262794424640057"
        frameborder="0"
        style="min-width:100%;max-width:100%;height:700px;border:none;"
        scrolling="no">
      </iframe>
    </main>

    <footer class="footer">
      <p>Thank you for celebrating with us! 💕</p>
    </footer>
  </div>

  <!-- Jotform Auto-Resizer Script -->
  <script src="https://cdn.jotfor.ms/s/umd/latest/for-form-embed-handler.js"></script>
  <script>
    window.jotformEmbedHandler("iframe[id='JotFormIFrame-262794424640057']", "https://form.jotform.com/")
  </script>

</body>
</html>
