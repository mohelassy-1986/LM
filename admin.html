<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Lina & Moustafa</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="index.html" class="brand">L & M Admin</a>
    <div style="margin-top:0.5rem;">
      <a href="index.html" style="color: var(--soft-gold); text-decoration: none; font-size: 0.9rem; margin-right: 15px;">← Back to Guestbook</a>
      <button type="button" onclick="adminLogout()" style="background:none; border:none; color: var(--rose-gold); cursor:pointer; font-size:0.9rem; text-decoration:underline;">Logout</button>
    </div>
  </header>

  <main class="container">
    <!-- Password Protection Form -->
    <div id="admin-login" class="form-card" style="max-width: 400px; margin: 4rem auto;">
      <h2 style="text-align:center; margin-bottom:1.5rem;" class="gold-gradient-text">Admin Login</h2>
      <div class="form-group">
        <label for="admin-pass">Password</label>
        <input type="password" id="admin-pass" class="form-control" placeholder="Enter admin password">
      </div>
      <button type="button" class="btn-primary" onclick="checkAdminAuth()">Login</button>
    </div>

    <!-- Protected Dashboard Area -->
    <div id="admin-dashboard" style="display: none;">
      
      <!-- Stats Overview -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="stat-total">0</div>
          <div>Total Submissions</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-approved">0</div>
          <div>Approved Messages</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-pending">0</div>
          <div>Pending Approval</div>
        </div>
      </div>

      <!-- MAIN FOCUS: Submissions Approval Table -->
      <div class="form-card" style="overflow-x: auto;">
        <h3 style="color:var(--rose-gold); margin-bottom:1rem; font-family:'Playfair Display', serif;">Guest Submissions Approval</h3>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Relationship</th>
              <th>Message</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-submissions-body">
            <tr>
              <td colspan="6" style="text-align:center; color: var(--text-muted);">Loading submissions...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- COLLAPSED / SECONDARY: Backend Sync Settings -->
      <details class="config-drawer">
        <summary class="config-summary">
          ⚙️ Google Sync & Backend Configurations
        </summary>
        <div class="config-content">
          <div class="form-group">
            <label for="cfg-apps-script">Google Apps Script Backend URL</label>
            <input type="url" id="cfg-apps-script" class="form-control" placeholder="https://script.google.com/macros/s/XXXXXXXX/exec">
          </div>

          <div class="form-group">
            <label for="cfg-drive-folder">Google Drive Folder ID</label>
            <input type="text" id="cfg-drive-folder" class="form-control" placeholder="1ABC123XYZ">
          </div>

          <div class="form-group">
            <label for="cfg-sheet-id">Google Sheet ID</label>
            <input type="text" id="cfg-sheet-id" class="form-control" placeholder="1ABC123XYZ">
          </div>

          <button type="button" class="btn-primary" style="width:auto; padding:0.6rem 1.2rem; font-size:0.9rem;" onclick="saveAdminConfig()">Save Sync Settings</button>
        </div>
      </details>

    </div>
  </main>

  <footer>
    <p>Lina & Moustafa Wedding Guest Book Admin Portal &copy; 2026</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
