<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Lina & Moustafa</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header>
    <a href="index.html" class="brand">L & M Admin</a>
  </header>

  <main class="container">
    <!-- Password Protection -->
    <div id="admin-login" class="form-card" style="max-width: 400px; margin: 4rem auto;">
      <h2 style="text-align:center; margin-bottom:1rem;" class="gold-gradient-text">Admin Login</h2>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="admin-pass" class="form-control">
      </div>
      <button class="btn-primary" onclick="checkAdminAuth()">Login</button>
    </div>

    <!-- Protected Dashboard Area -->
    <div id="admin-dashboard" style="display: none;">
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="stat-total">0</div>
          <div>Total Submissions</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-approved">0</div>
          <div>Approved Messages</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-pending">0</div>
          <div>Pending Approval</div>
        </div>
      </div>

      <!-- Config Form -->
      <div class="form-card">
        <h3 style="color:var(--soft-gold); margin-bottom:1rem;">Backend Configuration Settings</h3>
        <div class="form-group">
          <label>Google Apps Script Backend URL</label>
          <input type="url" id="cfg-apps-script" class="form-control" placeholder="https://script.google.com/macros/s/.../exec">
          <small style="color:var(--text-muted)">The backend URL receiving memory submissions.</small>
        </div>
        <div class="form-group">
          <label>Google Drive Folder ID</label>
          <input type="text" id="cfg-drive-folder" class="form-control" placeholder="1ABC123XYZ">
        </div>
        <div class="form-group">
          <label>Google Sheet ID</label>
          <input type="text" id="cfg-sheet-id" class="form-control" placeholder="1ABC123XYZ">
        </div>
        <button class="btn-primary" style="width:auto; padding:0.6rem 1.2rem;" onclick="saveAdminConfig()">Save Configuration</button>
      </div>

      <!-- Submissions Management Table -->
      <div class="form-card">
        <h3 style="color:var(--soft-gold); margin-bottom:1rem;">Guest Submissions</h3>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Relationship</th>
              <th>Message</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-submissions-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
